name: Fetch AFL data

on:
  schedule:
    # Thursday 06:37 UTC = 16:37 AEST / 17:37 AEDT. Serves the Thursday night
    # game, whose roster lands ~24h ahead of the weekly team announcement. Run
    # early enough to survive daylight saving: at 08:00 UTC an AEDT round left
    # only 30 minutes before a 19:30 bounce. The offset minute avoids the queue
    # that builds on the hour, when scheduled runs are most often delayed.
    - cron: '37 6 * * 4'
    # Friday 02:00 UTC = 12:00 Friday AEST, after Thursday evening's team
    # announcement, so this run has rosters for the whole weekend.
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      round:
        description: 'Round number (blank = auto-detect next round)'
        required: false
        type: string
      year:
        description: 'Season year (blank = current year)'
        required: false
        type: string

concurrency:
  group: fetch-afl-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: afl-bet-scanner

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch AFL data
        run: |
          mkdir -p src/data
          node scripts/fetch-afl-data.js \
            ${{ inputs.round && format('--round {0}', inputs.round) || '' }} \
            ${{ inputs.year && format('--year {0}', inputs.year) || '' }}

      # Bookmaker prop odds. The script exits cleanly when ODDS_API_KEY is
      # absent, and the app falls back to modelled lines, so a missing or
      # exhausted key degrades the feed rather than breaking the build.
      - name: Fetch bookmaker odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.js

      # The track record is shown in the UI, so it must not go stale as results
      # land. A failure here must not block the data refresh or the deploy.
      - name: Refresh backtest
        continue-on-error: true
        run: node scripts/backtest.js --years 2021-$(date -u +'%Y') --write

      - name: Build
        run: npm run build

      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --force src/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh AFL data $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Vercel's Git integration deploys from this push - there is no
            # separate deploy step, and no token to expire.
            git push
          fi
